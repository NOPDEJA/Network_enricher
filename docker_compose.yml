services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    ports:
      - "9092:9092"
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://${REDPANDA_EXTERNAL_ADDR:-localhost}:9092

  clickhouse:
    image: clickhouse/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=default
      # Recent clickhouse-server images reject empty passwords for remote
      # connections — set CLICKHOUSE_PASSWORD in .env (see README).
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-enricher_dev}
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  goflow2:
    image: netsampler/goflow2:latest
    ports:
      - "2055:2055/udp"
      - "4739:4739/udp"
      - "6343:6343/udp"
    command:
      - -listen=netflow://:2055,netflow://:4739,sflow://:6343
      - -transport=kafka
      - -transport.kafka.brokers=redpanda:29092
      - -transport.kafka.topic=raw-flows
      - -format=json
    depends_on:
      - redpanda
    restart: on-failure

  nflow-generator:
    image: networkstatic/nflow-generator
    command:
      - -t
      - goflow2
      - -p
      - "2055"
    depends_on:
      - goflow2
    restart: on-failure

  bind9:
    image: internetsystemsconsortium/bind9:9.20
    # Host networking: named binds each interface address individually, which
    # coexists with systemd-resolved's 127.0.0.53 stub (a wildcard 0.0.0.0:53
    # publish would conflict) and picks up new interface addresses on its own —
    # campus clients will point at whatever IP the box holds.
    network_mode: host
    volumes:
      - ./bind/named.conf:/etc/bind/named.conf:ro
      - bind9-log:/var/log/bind
    restart: on-failure

  dnstap-export:
    # Same image as bind9 — it ships dnstap-read, which converts BIND's binary
    # dnstap stream to the YAML text the enricher's dnstap parser ingests.
    image: internetsystemsconsortium/bind9:9.20
    # Re-convert the whole dnstap.bin every 15s to /export/dnstap.yaml. dnstap.bin
    # is append-only and dnstap-read is deterministic, so the output PREFIX is
    # byte-identical each pass — the enricher's file poller reads only the appended
    # tail. Writing via .work/*.tmp + same-filesystem mv is atomic, and .work/ (a
    # subdir) stays invisible to the poller since scanAppendedDir skips dirs. On
    # BIND's 100m dnstap rotation the output shrinks and readAppendedFile re-reads
    # from offset 0 (ReplacingMergeTree absorbs the overlap).
    #
    # Accepted limitation: full re-conversion of up to ~100MB per cycle is fine at
    # lab scale; a live fstrm-socket consumer is the future fix.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /export/.work
        while true; do
          [ -f /var/log/bind/dnstap.bin ] && dnstap-read -y /var/log/bind/dnstap.bin > /export/.work/dnstap.yaml.tmp && mv /export/.work/dnstap.yaml.tmp /export/dnstap.yaml
          sleep 15
        done
    volumes:
      - bind9-log:/var/log/bind:ro
      - .\bind\export:/export
    depends_on:
      - bind9
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      # Plugin that talks to ClickHouse over the native protocol (port 9000).
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      # Anonymous admin: zero-login demo access on http://localhost:3000.
      # Fine for a local/lab rig; lock this down before any real deployment.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      # Same password the datasource provisioning reads (matches ClickHouse).
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-enricher_dev}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - clickhouse

volumes:
  clickhouse-data:
  grafana-data:
  bind9-log: