services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    ports:
      - "9092:9092"
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092

  clickhouse:
    image: clickhouse/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=

  goflow2:
    image: netsampler/goflow2:latest
    ports:
      - "2055:2055/udp"
      - "4739:4739/udp"
    command:
      - -listen=netflow://:2055
      - -listen=netflow://:4739
      - -transport=kafka
      - -transport.kafka.brokers=redpanda:29092
      - -transport.kafka.topic=raw-flows
      - -format=json
    depends_on:
      - redpanda
    restart: on-failure
    healthcheck:
      test: ["CMD", "sh", "-c", "cat /proc/net/udp6 | grep 0807"]
      interval: 5s
      timeout: 3s
      retries: 10

  nflow-generator:
    image: networkstatic/nflow-generator
    command:
      - -t
      - goflow2
      - -p
      - "2055"
    depends_on:
      goflow2:
        condition: service_healthy
    restart: on-failure