services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    ports:
      - "9092:9092"
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://${REDPANDA_EXTERNAL_ADDR:-localhost}:9092

  clickhouse:
    image: clickhouse/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=default
      # Recent clickhouse-server images reject empty passwords for remote
      # connections — set CLICKHOUSE_PASSWORD in .env (see README).
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-enricher_dev}
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  goflow2:
    image: netsampler/goflow2:latest
    ports:
      - "2055:2055/udp"
      - "4739:4739/udp"
    command:
      - -listen=netflow://:2055,netflow://:4739
      - -transport=kafka
      - -transport.kafka.brokers=redpanda:29092
      - -transport.kafka.topic=raw-flows
      - -format=json
    depends_on:
      - redpanda
    restart: on-failure

  nflow-generator:
    image: networkstatic/nflow-generator
    command:
      - -t
      - goflow2
      - -p
      - "2055"
    depends_on:
      - goflow2
    restart: on-failure

volumes:
  clickhouse-data: